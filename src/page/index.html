<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squid</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦑</text></svg>">
<style>
  /* Sakura Dusk: the colours of your desktop (dotfiles, sigil's theme). */
  :root {
    --bg: #120e16; --panel: #1c1622; --sel: #2d2238; --border: #2e2538; --border-hi: #44355a;
    --fg: #f4eaf0; --text: #ddd0dc; --muted: #a093ad; --dim: #5b4e68;
    --pink: #f2a0c0; --blue: #8ea8f0; --violet: #b393e8; --brand: #9b5de5;
    --green: #1ed760; --warn: #f3c587; --red: #ff6f91;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 2px solid var(--brand); }
  .logo { color: var(--pink); font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  #folder { color: var(--muted); font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #model { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .spacer { flex: 1; }
  header button, .buttons button, #send { background: var(--sel); border: 1px solid var(--border-hi); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  header button:hover:not(:disabled), .buttons button:hover, #send:hover { border-color: var(--brand); }
  button:disabled { opacity: .45; cursor: default; }
  #mode { font-family: var(--mono); font-size: 13px; }
  #mode[data-mode="auto"] { color: var(--green); }
  #mode[data-mode="plan"] { color: var(--blue); }

  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  main > * { max-width: 920px; margin-left: auto; margin-right: auto; }
  .you { width: fit-content; max-width: 80%; margin: 18px 0 10px auto; padding: 8px 14px; background: var(--sel); border: 1px solid var(--violet); border-radius: 12px 12px 2px 12px; color: var(--fg); white-space: pre-wrap; }
  .turn > * { margin: 6px 0; }
  .answer { white-space: pre-wrap; color: var(--fg); }
  .answer code { font-family: var(--mono); font-size: 13px; background: var(--sel); padding: 1px 5px; border-radius: 4px; color: var(--pink); }
  .answer pre, pre.block, pre.note { font-family: var(--mono); font-size: 13px; margin: 6px 0; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; white-space: pre; }
  pre.note { background: none; border: none; padding: 0 0 0 4px; color: var(--muted); white-space: pre-wrap; }
  .del { color: var(--red); }
  .ins { color: var(--green); }
  details.thinking { color: var(--dim); font-size: 13px; }
  details.thinking summary { cursor: pointer; color: var(--muted); }
  details.thinking pre { white-space: pre-wrap; font-family: inherit; margin: 4px 0 0 14px; }
  .error { color: var(--red); }
  .info { color: var(--muted); }

  .card { margin: 10px 0; padding: 10px 14px; background: var(--panel); border: 1px solid var(--brand); border-radius: 8px; }
  .card.answered { border-color: var(--border-hi); opacity: .8; }
  .card .title { color: var(--fg); font-weight: 600; }
  .card .reason { color: var(--muted); font-size: 13px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .buttons button.yes { background: var(--green); color: #0d1a12; border-color: var(--green); font-weight: 600; }
  .buttons button.no { border-color: var(--red); }
  .buttons input { flex: 1; min-width: 220px; background: var(--bg); border: 1px solid var(--border-hi); border-radius: 6px; padding: 4px 10px; }
  .chosen { color: var(--muted); font-size: 13px; }

  footer { padding: 8px 16px 14px; background: var(--panel); border-top: 1px solid var(--border); }
  footer > * { max-width: 920px; margin-left: auto; margin-right: auto; }
  #meter { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #meter .bar { flex: 0 0 160px; height: 5px; background: var(--sel); border-radius: 3px; overflow: hidden; }
  #meter-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--violet), var(--pink)); }
  #meter.full #meter-fill { background: var(--red); }
  #composer { display: flex; gap: 8px; }
  #input { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border-hi); border-radius: 8px; padding: 8px 12px; }
  #input:focus { outline: none; border-color: var(--brand); }
  #send.stop { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<header>
  <span class="logo">🦑 squid</span>
  <span id="folder"></span>
  <span class="spacer"></span>
  <span id="model"></span>
  <button id="mode" title="Change mode (or Shift+Tab in the message box)">manual</button>
  <button id="undo" title="Put back the files the agent changed for your last message">Undo</button>
  <button id="clear" title="Start a new conversation">New</button>
</header>
<main id="log"></main>
<footer>
  <div id="meter"><div class="bar"><div id="meter-fill"></div></div><span id="meter-text"></span></div>
  <form id="composer">
    <textarea id="input" rows="2" placeholder="Ask about this folder…  Enter sends · Shift+Enter new line · Shift+Tab changes mode"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</footer>
<script src="/page.js"></script>
</body>
</html>
